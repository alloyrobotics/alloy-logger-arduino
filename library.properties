sentence=Stream ESP32 and Arduino UNO R4 WiFi sensor telemetry directly to Alloy (usealloy.ai).
paragraph=RAM-buffered logging from Arduino boards to the Alloy data platform. ESP32 retains the existing background logger; UNO R4 WiFi uses a separate cooperative, allocation-free binary capture core with a bounded RAM journal and verified TLS transport. Every power-on becomes one MCAP mission in Alloy.
