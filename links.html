<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alloy | Links</title>
  <meta name="description" content="Follow Alloy, explore AlloyLogger and Mesh Storage, or try Alloy on a robot log." />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="canonical" href="https://alloylogger.com/links" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --canvas: #0a0a0a;
      --blue: #025dfe;
      --blue-soft: #6ba0ff;
      --sage: #d3eeb6;
      --white: #fff;
    }

    * { box-sizing: border-box; }

    html { background: var(--canvas); }

    body {
      min-width: 320px;
      margin: 0;
      background: var(--canvas);
      color: var(--white);
      font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .page-shell {
      position: relative;
      isolation: isolate;
      display: grid;
      min-height: 100svh;
      place-items: center;
      overflow: hidden;
      padding: 36px 18px;
      background: var(--canvas);
    }

    .page-shell::before {
      position: absolute;
      top: 16%;
      left: 50%;
      z-index: -1;
      width: min(720px, 120vw);
      height: 560px;
      background: radial-gradient(ellipse, rgba(2, 93, 254, .16), rgba(5, 34, 146, .06) 42%, transparent 70%);
      content: "";
      filter: blur(18px);
      transform: translateX(-50%);
    }

    .link-hub { width: min(100%, 520px); }

    .brand-header {
      display: flex;
      justify-content: center;
      margin-bottom: 42px;
    }

    .brand-home {
      display: inline-flex;
      border-radius: 8px;
    }

    .brand-home:focus-visible,
    .destination:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 4px;
    }

    .brand-lockup {
      display: block;
      width: auto;
      height: 43px;
      filter: drop-shadow(0 0 22px rgba(2, 93, 254, .2));
    }

    .link-list {
      display: grid;
      gap: 12px;
    }

    .destination {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-columns: 50px minmax(0, 1fr) 20px;
      min-height: 82px;
      gap: 16px;
      align-items: center;
      overflow: hidden;
      padding: 12px 19px 12px 13px;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 12px;
      background: linear-gradient(175deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .035) 43%, rgba(255, 255, 255, .07));
      box-shadow: 0 14px 34px rgba(0, 0, 0, .28), inset 0 1px 0 rgba(255, 255, 255, .42), inset 0 -10px 20px rgba(255, 255, 255, .025);
      backdrop-filter: blur(16px) saturate(165%);
      -webkit-backdrop-filter: blur(16px) saturate(165%);
      letter-spacing: -.02em;
      transition: border-color 160ms ease, background-color 160ms ease, transform 160ms ease;
    }

    .destination::after {
      position: absolute;
      inset: 0;
      z-index: -1;
      background: radial-gradient(90% 75% at 12% -25%, rgba(255, 255, 255, .22), transparent 64%);
      content: "";
      pointer-events: none;
    }

    .destination:hover {
      border-color: rgba(107, 160, 255, .58);
      background-color: rgba(2, 93, 254, .08);
      transform: translateX(4px);
    }

    .destination-icon {
      display: grid;
      width: 50px;
      height: 50px;
      place-items: center;
      border: 1px solid rgba(107, 160, 255, .32);
      border-radius: 10px;
      background: linear-gradient(160deg, rgba(2, 93, 254, .3), rgba(5, 34, 146, .18));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 0 18px rgba(2, 93, 254, .1);
      color: #cfe0ff;
      transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    .destination:hover .destination-icon {
      border-color: rgba(107, 160, 255, .62);
      background-color: rgba(2, 93, 254, .25);
      color: var(--white);
    }

    .destination-icon svg,
    .destination-icon img {
      display: block;
      width: 23px;
      height: 23px;
    }

    .destination-icon img {
      object-fit: contain;
    }

    .icon-try {
      border-color: rgba(211, 238, 182, .25);
      background: linear-gradient(160deg, rgba(211, 238, 182, .16), rgba(2, 93, 254, .12));
      color: var(--sage);
    }

    .destination-copy {
      display: grid;
      min-width: 0;
      gap: 4px;
    }

    .destination-name {
      overflow: hidden;
      font-size: 17px;
      line-height: 1.1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .destination-description {
      overflow: hidden;
      color: rgba(255, 255, 255, .52);
      font-size: 13px;
      line-height: 1.2;
      letter-spacing: -.01em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .destination-arrow {
      width: 18px;
      height: 18px;
      color: rgba(255, 255, 255, .45);
      transition: color 160ms ease, transform 160ms ease;
    }

    .destination:hover .destination-arrow {
      color: var(--blue-soft);
      transform: translate(1px, -1px);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 520px) {
      .page-shell { place-items: start center; padding-top: 54px; }
      .brand-header { margin-bottom: 36px; }
      .brand-lockup { height: 38px; }
      .destination {
        grid-template-columns: 48px minmax(0, 1fr) 18px;
        min-height: 78px;
        gap: 13px;
        padding: 11px 15px 11px 11px;
      }
      .destination-icon { width: 48px; height: 48px; }
      .destination-description { font-size: 12.5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <section class="link-hub">
      <header class="brand-header">
        <h1 class="visually-hidden">Alloy links</h1>
        <a class="brand-home" href="https://www.usealloy.ai/" target="_blank" rel="noreferrer" aria-label="Visit the Alloy website">
          <img class="brand-lockup" src="/links-alloy-lockup-white.png" alt="Alloy" width="2000" height="646" />
        </a>
      </header>

      <nav class="link-list" aria-label="Alloy destinations">
        <a class="destination" href="https://www.linkedin.com/company/alloyrobotics" target="_blank" rel="noreferrer" aria-label="LinkedIn: Company updates">
          <span class="destination-icon" aria-hidden="true">
            <svg viewBox="0 0 448 512" fill="currentColor"><path d="M100.28 448H7.4V148.9h92.88zM53.79 108.1C24.09 108.1 0 83.5 0 53.8a53.79 53.79 0 0 1 107.58 0c0 29.7-24.1 54.3-53.79 54.3zM447.9 448h-92.68V302.4c0-34.7-.7-79.2-48.29-79.2-48.29 0-55.69 37.7-55.69 76.7V448h-92.78V148.9h89.08v40.8h1.3c12.4-23.5 42.69-48.3 87.88-48.3 94 0 111.28 61.9 111.28 142.3V448z" /></svg>
          </span>
          <span class="destination-copy"><span class="destination-name">LinkedIn</span><span class="destination-description">Company updates</span></span>
          <svg class="destination-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
        </a>

        <a class="destination" href="https://x.com/alloyrobotics" target="_blank" rel="noreferrer" aria-label="X: Robots, data, and the build">
          <span class="destination-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.234 10.162 22.977 0h-2.072l-7.591 8.824L7.251 0H.258l9.168 13.343L.258 24H2.33l8.016-9.318L16.749 24h6.993zm-2.837 3.299-.929-1.329L3.076 1.56h3.182l5.965 8.532.929 1.329 7.754 11.09h-3.182z" /></svg>
          </span>
          <span class="destination-copy"><span class="destination-name">X</span><span class="destination-description">Robots, data, and the build</span></span>
          <svg class="destination-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
        </a>

        <a class="destination" href="https://alloylogger.com/" target="_blank" rel="noreferrer" aria-label="AlloyLogger: Stream ESP32 telemetry into Alloy">
          <span class="destination-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2" /></svg>
          </span>
          <span class="destination-copy"><span class="destination-name">AlloyLogger</span><span class="destination-description">Stream ESP32 telemetry into Alloy</span></span>
          <svg class="destination-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
        </a>

        <a class="destination" href="https://docs.usealloy.ai/docs/mesh-storage/overview" target="_blank" rel="noreferrer" aria-label="Mesh Storage: Store, replay, and query robot logs">
          <span class="destination-icon" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M13.333 4.667h-2A1.333 1.333 0 0 1 10 3.333v-2M2 5.067V13.6a1.067 1.067 0 0 0 1.067 1.067H9.6M6 12a1.333 1.333 0 0 1-1.333-1.333v-8A1.333 1.333 0 0 1 6 1.333h4.667L13.333 4v6.667A1.333 1.333 0 0 1 12 12H6Z"/></svg>
          </span>
          <span class="destination-copy"><span class="destination-name">Mesh Storage</span><span class="destination-description">Store, replay, and query robot logs</span></span>
          <svg class="destination-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
        </a>

        <a class="destination" href="https://try.usealloy.ai/" target="_blank" rel="noreferrer" aria-label="Try Alloy: Analyze a robot log in your browser">
          <span class="destination-icon icon-try" aria-hidden="true">
            <img src="/links-alloy-mark.png" alt="" width="256" height="256" />
          </span>
          <span class="destination-copy"><span class="destination-name">Try Alloy</span><span class="destination-description">Analyze a robot log in your browser</span></span>
          <svg class="destination-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
        </a>
      </nav>
    </section>
  </main>
</body>
</html>
