; PlatformIO project that builds the FirstMission example from this library checkout.
;
;   cd mcu/arduino/extras/platformio
;   pio run -e esp32c3 -t upload && pio device monitor -e esp32c3
;
; Edit the four settings at the top of examples/FirstMission/FirstMission.ino first.
; In your own project, replace the symlink with
;   lib_deps = https://github.com/alloyrobotics/alloy-storage-sdk.git
; (see the PlatformIO section of mcu/arduino/README.md).

[platformio]
src_dir = ../../examples/FirstMission

[env]
; Official PlatformIO platform 8.x = Arduino-ESP32 3.3. Arduino-ESP32 2.x (platform 7.x and
; older) is not supported.
platform = espressif32 @ ^8.0.0
framework = arduino
monitor_speed = 115200
lib_deps = symlink://../..
; FirstMission with Wi-Fi and verified TLS is about 1.1-1.35 MB, close to or over the 1.25 MB app
; slot of the default 4 MB table. min_spiffs gives the app 1.9 MB.
board_build.partitions = min_spiffs.csv

[env:esp32c3]
board = esp32-c3-devkitm-1
; Native USB-Serial/JTAG console: route Serial to USB.
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3]
board = esp32-s3-devkitc-1

[env:esp32]
board = esp32dev

; The same boards on pioarduino, the community platform that tracks Arduino-ESP32 releases.
[pioarduino]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip

[env:esp32c3-pioarduino]
extends = env:esp32c3
platform = ${pioarduino.platform}

[env:esp32s3-pioarduino]
extends = env:esp32s3
platform = ${pioarduino.platform}

[env:esp32-pioarduino]
extends = env:esp32
platform = ${pioarduino.platform}
